services:
  - type: web
    name: iste-cert-hub-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --loop asyncio --timeout-keep-alive 75"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_PASS
        sync: false
      - key: GATEKEEPER_PASSWORD
        sync: false
      - key: GAS_MAILER_URL
        sync: false

  # ---------------------------------------------------------------------------
  # NOTE: Keepalive cron is intentionally NOT defined here.
  # GitHub Actions (.github/workflows/keepalive.yml) handles keep-alive pings
  # every 10 minutes with retry logic and failure reporting — far more reliable
  # than a Render cron service which itself sleeps and causes a cold-start loop.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Daily DB Cleanup Cron Job
  # Calls the /api/admin/cleanup endpoint every day at 2 AM UTC to prune old
  # certificate logs when Supabase storage approaches the 500 MB free limit.
  # NOTE: GATEKEEPER_PASSWORD must be explicitly set here — Render cron jobs
  # do NOT inherit env vars from the web service automatically.
  # ---------------------------------------------------------------------------
  - type: cron
    name: iste-cert-hub-db-cleanup
    env: python
    schedule: "0 2 * * *"
    buildCommand: "pip install requests"
    startCommand: >
      python -c "
      import requests, os, sys, json;
      url = os.getenv('BACKEND_URL', 'https://certificate-generator-app-v2.onrender.com') + '/api/admin/cleanup?force=false';
      password = os.getenv('GATEKEEPER_PASSWORD');
      if not password:
          print('ERROR: GATEKEEPER_PASSWORD env var is not set on this cron job. Set it in Render dashboard.');
          sys.exit(1);
      r = requests.post(url, json={'password': password}, timeout=60);
      print(json.dumps(r.json(), indent=2));
      sys.exit(0 if r.ok else 1)
      "
    envVars:
      - key: BACKEND_URL
        value: https://certificate-generator-app-v2.onrender.com
      - key: GATEKEEPER_PASSWORD
        sync: false
