name: Keep Backend Alive

# Runs every 10 minutes to prevent Render free-tier from sleeping (sleeps after 15 min inactivity)
# GitHub Actions is always-on — far more reliable than Render's own cron jobs for this purpose.
on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes, 24/7
  workflow_dispatch:          # allow manual trigger for testing

jobs:
  ping:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping /health endpoint
        id: ping
        run: |
          BACKEND_URL="https://certificate-generator-app-v2.onrender.com"
          HEALTH_URL="${BACKEND_URL}/health"

          echo "🔔 Pinging: ${HEALTH_URL}"

          # Retry up to 3 times with 10s delay (handles cold-start lag)
          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
              --max-time 30 \
              --connect-timeout 15 \
              "${HEALTH_URL}" || echo "000")

            BODY=$(cat /tmp/body.txt 2>/dev/null || echo "")
            echo "Attempt ${i}: HTTP ${HTTP_CODE} | Body: ${BODY}"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Backend is alive (HTTP 200)"
              echo "status=ok" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "⚠️  Attempt ${i} failed (HTTP ${HTTP_CODE}). Waiting 10s before retry..."
            sleep 10
          done

          echo "❌ Backend did not respond after 3 attempts."
          echo "status=down" >> $GITHUB_OUTPUT
          exit 1   # Fail the job so GitHub marks it red — easy to spot in Actions tab

      - name: Report status
        if: always()
        run: |
          if [ "${{ steps.ping.outputs.status }}" = "ok" ]; then
            echo "### ✅ Backend Alive" >> $GITHUB_STEP_SUMMARY
            echo "Render backend responded with HTTP 200 at $(date -u)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Backend Down" >> $GITHUB_STEP_SUMMARY
            echo "Render backend did NOT respond after 3 retries at $(date -u)" >> $GITHUB_STEP_SUMMARY
            echo "Check Render dashboard: https://dashboard.render.com" >> $GITHUB_STEP_SUMMARY
          fi
